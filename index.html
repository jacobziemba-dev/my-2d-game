<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Summoner's Estate - Top-Down Version</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div id="desktop-hint">WASD to Move | SPACE to Summon | Mouse to Navigate Menu</div>
    </div>

    <!-- Mobile Controls -->
    <div class="controls" id="mobileControls">
        <div class="joystick-zone" id="joystick">
            <div class="joystick-knob" id="knob"></div>
        </div>
        <div class="action-btn" id="summonBtn">SUMMON</div>
    </div>

    <script type="module" src="src/main.js"></script>
</body>
</html>
