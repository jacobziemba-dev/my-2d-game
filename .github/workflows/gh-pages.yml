name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

# Give the workflow explicit write permissions so it can push the `gh-pages` branch
permissions:
  contents: write
  pages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (optional)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build with Vite
        run: npm run build

      # Optional: run Claude Code Action. Requires `ANTHROPICS_API_KEY` set in repository secrets.
      - name: Claude Code Action Official
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPICS_API_KEY: ${{ secrets.ANTHROPICS_API_KEY }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
